name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR or branch makes the older run moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The repo is public and takes PRs from forks: nothing here needs to write.
permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 20 is what the Dockerfile ships. 24 is the upgrade target: Node 20 is
        # past end of life, and this shows whether the move is safe before
        # anyone rebuilds the production image.
        node: [20, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Unit tests only: pure logic and the in-memory state machine, no Postgres.
      - run: npm test
      # Same build the Dockerfile runs, so a broken image build shows up here.
      - run: npm run build
